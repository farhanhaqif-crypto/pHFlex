<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>pHFLEX — AR Viewer</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>

  <!-- A-Frame + AR.js -->
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.3/aframe/build/aframe-ar.min.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

  <style>
    :root {
      --panel: rgba(255,255,255,0.03);
      --muted: #9aa7b2;
      --accent: #33ff77;
    }

    html,body {
      height:100%;
      margin:0;
      background:linear-gradient(180deg,#041016,#071827);
      font-family:Inter,system-ui,Segoe UI,Roboto,Arial;
      color:#e6f3f8;
    }

    .app {
      display:flex;
      gap:14px;
      padding:14px;
      box-sizing:border-box;
      height:100vh;
    }

    .col {
      background:var(--panel);
      border-radius:10px;
      padding:14px;
      box-shadow:0 6px 20px rgba(0,0,0,0.5);
      overflow:auto;
    }

    .center {
      flex:1.2;
      display:flex;
      flex-direction:column;
      align-items:center;
      min-width:300px;
    }

    .right {
      flex:0.9;
      min-width:260px;
    }

    .arBox {
      width:100%;
      max-width:700px;
      aspect-ratio: 3/4;
      background:#000;
      border-radius:10px;
      overflow:hidden;
      position:relative;
    }

    .loading {
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
      color:white;
      background:rgba(0,0,0,0.6);
      z-index:20;
    }

    .phPanel {
      margin-top:14px;
      text-align:center;
    }

    .phValue {
      font-size:30px;
      font-weight:700;
      color:var(--accent);
    }

    .category {
      font-size:18px;
      margin-top:6px;
      color:#ffd97a;
    }

    .section {
      margin-bottom:16px;
    }

    .section h3 {
      margin:0 0 8px 0;
      color:#cfeef0;
    }

    .section p {
      margin:0;
      font-size:14px;
      color:var(--muted);
      line-height:1.48;
    }

    @media (max-width:900px){
      .app {
        flex-direction:column;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- CENTER: AR Section -->
    <div class="col center">
      <div class="arBox">
        <div id="loading" class="loading">Initializing camera… Allow access</div>

        <a-scene embedded arjs="sourceType: webcam; debugUIEnabled:false;" vr-mode-ui="enabled:false">
          
          <a-marker preset="hiro" id="hiroMarker">

            <a-entity id="container">

              <!-- Liquid box -->
              <a-box id="liquid" position="0 0.12 0"
                     width="0.12" height="0.20" depth="0.14"
                     material="opacity:0.9;transparent:true;emissive:#33ff77;emissiveIntensity:0.7;">
              </a-box>

              <!-- pH Label -->
              <a-entity id="arPhText" visible="false" position="0 0.48 0"
                        text="value:pH: -- ; align:center; width:3; color:white;"></a-entity>

              <!-- Category Label -->
              <a-entity id="arCatText" visible="false" position="0 0.70 0"
                        text="value:-- ; align:center; width:3; color:#ffd97a;"></a-entity>

            </a-entity>

          </a-marker>

          <a-entity camera></a-entity>
        </a-scene>
      </div>

      <!-- Summary under AR -->
      <div class="phPanel">
        <div class="phValue" id="phValue">pH: --</div>
        <div class="category" id="categoryLabel">Category: --</div>
      </div>
    </div>

    <!-- RIGHT: Educational Content -->
    <div class="col right">
      <div class="section">
        <h3>Univers
